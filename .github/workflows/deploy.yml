name: Deploy Nylah OS to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Prepare artifact
        run: |
          echo "preparing static site from repo root"
          mkdir -p _site
          # copy root static files that are the Pages site
          cp -r assets _site/ 2>/dev/null || true
          cp index.html _site/ 2>/dev/null || true
          cp 404.html _site/ 2>/dev/null || true
          cp version.json _site/ 2>/dev/null || true
          cp manifest.webmanifest _site/ 2>/dev/null || cp manifest.json _site/ 2>/dev/null || true
          cp icon-*.png _site/ 2>/dev/null || true
          cp sw.js _site/ 2>/dev/null || true
          cp supabase-env.js _site/ 2>/dev/null || true
          # ensure we have index
          ls -lh _site/
          test -f _site/index.html || (echo "index.html missing!" && exit 1)
          cat _site/version.json | head -5
          echo "assets count $(ls _site/assets | wc -l)"
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
