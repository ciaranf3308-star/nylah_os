name: Deploy Nylah OS to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install deps
        run: |
          echo "deps ok"
          echo ok
      - name: Build client
        run: |
          echo "Build placeholder - using static files"
          mkdir -p client/dist/assets
          cp -r assets client/dist/ 2>/dev/null || true
          cp index.html client/dist/ 2>/dev/null || true
          cp 404.html client/dist/ 2>/dev/null || true
          cp version.json client/dist/ 2>/dev/null || true
          cp manifest.webmanifest client/dist/ 2>/dev/null || true
          cp icon-192.png client/dist/ 2>/dev/null || true
          cp icon-512.png client/dist/ 2>/dev/null || true
          echo "client dist prepared"
          ls -lh client/dist/ | head -20
          cat client/dist/version.json | head -20 || true
      - name: Prepare Pages artifact
        run: |
          mkdir -p _site
          cp -r client/dist/* _site/ 2>/dev/null || true
          cp index.html _site/ 2>/dev/null || true
          cp 404.html _site/ 2>/dev/null || true
          cp version.json _site/ 2>/dev/null || true
          mkdir -p _site/assets
          cp -r assets/* _site/assets/ 2>/dev/null || true
          echo "_site contents"
          ls -lh _site/ | head -20
          ls -lh _site/assets/ | head -20
          cat _site/version.json || echo "no version"
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
