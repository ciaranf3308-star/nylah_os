name: Deploy Nylah OS V119 to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages-v119-deploy"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install deps
        working-directory: client
        run: |
          bun install --frozen-lockfile || bun install
      - name: Build V119
        env:
          HATCH_SPACES_BUILD_DRIVER: 1
        run: |
          bun ./client/build.mjs
          echo "dist contents:"
          ls -lh client/dist
          ls -lh client/dist/assets
          test ! -f client/dist/supabase-init.sql && echo "no supabase-init.sql PASS" || (echo "FAIL supabase-init.sql present" && exit 1)
          sha256sum client/dist/assets/index-yc8eyqh9.js || true
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: client/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
